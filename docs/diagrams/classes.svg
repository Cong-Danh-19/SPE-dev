<svg font-family="DejaVu Sans, Arial, sans-serif" fill="#173449" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 700" width="1030" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Biểu đồ lớp của sáu Logical Process</title>
  <desc id="desc">Sáu lớp cụ thể SourceLP, SharedDispatcherLP, PartitionedDispatcherLP, WorkerLP, IoLP và SinkLP cùng kế thừa BaseSimLP. BaseSimLP kế thừa BkSysCoLogicalProcess của framework. Tam giác rỗng chỉ lớp cha.</desc>
  <defs>
  </defs>
  <rect width="1030" height="700" fill="white"/>
  <text x="30" y="37" font-size="26px" font-weight="700">Các lớp Logical Process</text>
  <text x="30" y="64" font-size="15px" fill="#465966">Tam giác rỗng chỉ lớp cha. Mỗi ô liệt kê các thuộc tính và phương thức liên quan đến mô phỏng.</text>
  <rect x="311" y="86" width="408" height="48" fill="#e4f2ee" stroke="#487569" stroke-width="1.5"/>
  <text x="515" y="116" font-size="18px" font-weight="700" text-anchor="middle">BkSysCoLogicalProcess</text>
  <path d="M515 161 V147" fill="none" stroke="#597986" stroke-width="1.6"/><path d="M515 135 l-7 12 h14 Z" fill="white" stroke="#597986" stroke-width="1.6"/>
  <rect x="311" y="161" width="408" height="91" fill="#e4f2ee" stroke="#487569" stroke-width="1.5"/><path d="M311 197 H719" fill="none" stroke="#597986" stroke-width="1.6"/>
  <text x="515" y="185" font-size="18px" font-weight="700" text-anchor="middle">BaseSimLP</text>
  <text x="330" y="218" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="14px">rng: random.Random</text><text x="330" y="239" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="14px">_send(now, dst, etype, payload, at)</text>
  <path d="M515 265 V602 M445 336 H585 M445 469 H585 M445 602 H585" fill="none" stroke="#597986" stroke-width="1.6"/><path d="M515 253 l-7 12 h14 Z" fill="white" stroke="#597986" stroke-width="1.6"/>
  <g fill="#f4f8fa" stroke="#608493" stroke-width="1.5">
    <rect x="30" y="285" width="415" height="104"/><rect x="585" y="285" width="415" height="104"/>
