    <text x="238" y="309">SourceLP</text><text x="792" y="309">WorkerLP</text>
    <text x="238" y="442">SharedDispatcherLP</text><text x="792" y="442">PartitionedDispatcherLP</text>
    <text x="238" y="575">IoLP</text><text x="792" y="575">SinkLP</text>
  </g>
  <g font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="14px">
    <text x="48" y="342">gamma, closed_C, sent, t_warm, t_last</text><text x="48" y="370">coroutine_run(), handle_event(e)</text>
    <text x="603" y="342">s, D, dist_cpu, heavy_prob, heavy_mult</text><text x="603" y="370">_sample_service(), handle_event(e)</text>
    <text x="48" y="475">c, K, Q: deque, idle, n</text><text x="48" y="503">_log(t), handle_event(e)</text>
    <text x="603" y="475">queues, counts, busy, k_per_worker</text><text x="603" y="503">_log(t), handle_event(e)</text>
    <text x="48" y="608">D, dist_io, backend_limit, n</text><text x="48" y="636">handle_event(e)</text>
